<h1 class="pagebreak">提示窗口</h1>
<p>“提示”窗口显示所选对象或调色板条目的提示。提供有关模型中概念和观点目的的基本信息可能很有用。</p>
<p>可以通过在“提示”窗口中选择 PIN按钮来固定所选提示。</p>
