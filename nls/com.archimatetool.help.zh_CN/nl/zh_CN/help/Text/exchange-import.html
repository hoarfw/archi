<h2>从Open Exchange XML文件导入</h2>
<p>要导入Open Exchange格式文件，请选择菜单项“文件- &gt;导入- &gt;打开Exchange XML模型...”。选择并打开所需的XML文件。这将在模型树中创建一个新的ArchiMate模型。</p>
