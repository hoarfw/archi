<title>技术使用视点</title>
</head>
<body>
<p>技术使用视点展示应用如何由软硬件技术支撑：技术服务由设备提供，系统软件与网络为应用提供运行基础。由于它把物理基础设施与应用的逻辑世界联系起来，因此在性能与可扩展性分析中非常重要。它还有助于依据各类应用的需求，确定基础设施在性能与质量方面的要求。</p>
<h2>干系人：</h2>
<p>应用架构师、基础设施架构师、运营经理</p>
<h2>关注的问题</h2>
<p>依赖关系、性能、可扩展性</p>
<h2>目的：</h2>
<p>设计</p>
<h2>范围：</h2>
<p>多层/多方面</p>
</body>
</html>
