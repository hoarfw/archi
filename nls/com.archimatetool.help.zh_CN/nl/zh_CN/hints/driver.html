<p>一个 <b>驱动因素</b> 代表激励组织定义其目标并实施实现目标所必需的变革的外部或内部条件。</p>
<h2>類別:</h2>
<p>动机</p>
<h2>示例：</h2>
<p>“客户满意度”、“遵守法规”、“盈利能力”、“经济变革”、“不断变化的法规”</p>
