<body>
<p>功能映射视点允许业务架构师创建企业功能的结构化概述。功能图通常显示整个企业的两个或三个级别的功能。例如，它可以用作热图来确定投资领域。在某些情况下，能力图还可能显示这些能力提供的具体结果。</p>
<h2>干系人：</h2>
<p>业务经理、企业和业务架构师</p>
<h2>关注的问题</h2>
<p>架构策略和战术、动机</p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>策略</p>
