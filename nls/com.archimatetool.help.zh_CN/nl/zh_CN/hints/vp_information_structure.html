<title>信息结构视角</title>
</head>
<body>
<p>信息结构观点与几乎所有信息系统开发中创建的传统信息模型相媲美。它以数据类型或（面向对象的）类结构的形式显示企业或特定业务流程或应用程序中使用的信息的结构。此外，它可以显示业务级别的信息如何以应用程序级别使用的数据结构的形式表示，以及如何将这些信息映射到底层技术基础设施上；例如，通过数据库架构。</p>
<h2>干系人：</h2>
<p>领域和信息架构师</p>
<h2>关注的问题</h2>
<p>所用数据和信息的结构和依赖性，一致性和完整性</p>
<h2>目的：</h2>
<p>设计</p>
<h2>范围：</h2>
<p>多层/单方面</p>
</body>
</html>
