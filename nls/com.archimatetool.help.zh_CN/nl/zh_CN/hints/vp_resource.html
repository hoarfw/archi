<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<title>资源地图视点</title>
</head>
<body>
<p>资源地图视点允许业务架构师对企业资源进行结构化总览。资源地图通常展示覆盖全企业的两到三个资源层级。例如，它可以作为热力图来识别投资重点区域。在某些情况下，资源地图还可以展示资源与其所分配能力之间的关系。</p>
<h2>干系人：</h2>
<p>业务经理、企业和业务架构师</p>
<h2>关注的问题</h2>
<p>架构策略和战术、动机</p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>策略</p>
</body>
</html>
