<p>一个 <b>视图</b> 是架构描述的一部分，可解决一系列相关问题，并针对特定利益相关者量身定制。</p>
<p>视图通过视点指定，该视点规定了视图提供的概念、模型、分析技术和可视化。</p>
<p>模型树中的相同元素可以在相同或不同的视图中重复使用多次。</p>
