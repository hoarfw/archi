<title>应用程序使用情况视点</title>
</head>
<body>
<p>应用程序使用情况视点描述了应用程序如何用于支持一个或多个业务流程，以及其他应用程序如何使用它们。它可用于通过识别业务流程和其他应用程序所需的服务来设计应用程序，或通过描述可用的服务来设计业务流程。此外，由于它标识了业务流程对应用程序的依赖性，因此对于负责这些流程的运营经理来说可能是有用的。</p>
<h2>干系人：</h2>
<p>企业、流程和应用架构师、运营经理</p>
<h2>关注的问题</h2>
<p>一致性和完整性，降低复杂性</p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>多层/多方面</p>
</body>
</html>
