<title>应用程序结构视点</title>
</head>
<body>
<p>应用程序结构视点显示一个或多个应用程序或组件的结构。这种观点对于设计或理解应用程序或组件的主要结构以及相关数据非常有用；例如，以分解正在构建的系统的结构，或确定适合迁移/集成的遗留应用程序组件。</p>
<h2>干系人：</h2>
<p>应用和解决方案架构师</p>
<h2>关注的问题</h2>
<p>应用程序结构、一致性和完整性，降低复杂性</p>
<h2>目的：</h2>
<p>设计</p>
<h2>范围：</h2>
<p>单层/多方面</p>
