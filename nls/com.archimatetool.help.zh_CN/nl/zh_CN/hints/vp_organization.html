<title>组织视点</title>
</head>
<body>
<p>组织观点侧重于公司、部门、公司网络或其他组织实体的（内部）组织。在这种观点下，可以将模型呈现为嵌套框图，但也可以以更传统的方式呈现，例如组织结构图。组织观点在识别组织中的能力、权限和责任方面非常有用。</p>
<h2>干系人：</h2>
<p>企业、流程和领域架构师、经理、员工、股东</p>
<h2>关注的问题</h2>
<p>能力、权限和责任的识别</p>
<h2>目的：</h2>
<p>设计、决策、告知</p>
<h2>范围：</h2>
<p>单层/单方面</p>
</body>
</html>
