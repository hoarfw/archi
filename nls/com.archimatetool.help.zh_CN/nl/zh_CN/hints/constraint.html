<body>

<p>一个 <b>约束</b> 表示对架构、其实施过程或实现方面的限制。</p>
<h2>類別:</h2>
<p>动机</p>
<h2>示例：</h2>
<p>“应用程序应在Java中实现” ， “成本应低于预算” ， “仅限iPad版本” ， “必须使用MIT许可证”</p>
