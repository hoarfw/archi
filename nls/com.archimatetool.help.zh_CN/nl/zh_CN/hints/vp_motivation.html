<title>激励观点</title>
</head>
<body>
<p>动机观点允许设计师或分析师对动机方面进行建模，而无需关注这方面的某些元素。例如，这种观点可用于通过关联利益相关者、其主要目标、应用的原则以及对服务、流程、应用程序和对象的主要要求，来呈现动机方面的完整或部分概述。</p>
<h2>干系人：</h2>
<p>企业和ICT架构师、业务分析师、需求经理</p>
<h2>关注的问题</h2>
<p>架构策略和战术、动机</p>
<h2>目的：</h2>
<p>设计、决策、告知</p>
<h2>范围：</h2>
<p>动机</p>
</body>
</html>
