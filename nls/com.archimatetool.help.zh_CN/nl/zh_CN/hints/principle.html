<p>一个 <b>原则和利益标签</b> 表示定义适用于体系结构中特定上下文中的任何系统的一般属性的意向声明。</p>
<h2>類別:</h2>
<p>动机</p>
<h2>示例：</h2>
<p>“系统应该面向客户” ， “客户应该有很好的体验” ， “同事应该被告知” ， “应该使用开源软件”</p>
