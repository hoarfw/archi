<title>业务合作</title>
</head>
<body>

<p>一个 <b>业务合作</b> 表示两个或多个业务内部活动结构元素的聚合，这些元素协同工作以执行集体行为。</p>
<h2>類別:</h2>
<p>业务。主动结构。</p>
<h2>示例：</h2>
<p>销售部门和广告部门的业务角色可以形成临时的业务合作，以将产品推向市场。房屋保险卖方和旅游保险卖方的业务角色可以形成临时业务合作，以形成联合保险销售服务。</p>
</body>
