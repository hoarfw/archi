<title>业务角色</title>

<body>

<p>一个 <b>业务角色</b> 表示执行特定行为的责任，演员可以分配给该行为，或者演员在特定动作或事件中扮演的角色。</p>
<h2>類別:</h2>
<p>业务。主动结构。</p>
<h2>示例：</h2>
<p>客户、保险公司、供应商、讲师、管理员、买方。</p>
