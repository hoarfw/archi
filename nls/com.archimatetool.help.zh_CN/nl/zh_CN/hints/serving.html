<body>

<p>这 <b>服务关系</b> 表示一个元素将其功能提供给另一个元素。</p>
<h2>類別:</h2>
<p>(d) 受抚养家属。</p>
<h2>示例：</h2>
<p>支付界面为客户提供服务，而支付服务则为该客户的付款发票流程提供服务。</p>
</body>
