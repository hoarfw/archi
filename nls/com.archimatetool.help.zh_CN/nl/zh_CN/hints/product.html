<p>一个 <b>产品</b> 代表了连贯的服务和/或被动结构元素的集合，并附有整体提供给（内部或外部）客户的合同。</p>
<h2>類別:</h2>
<p>商务。综合。</p>
<h2>示例：</h2>
<p>由保险服务和合同组成的旅行保险产品。</p>
