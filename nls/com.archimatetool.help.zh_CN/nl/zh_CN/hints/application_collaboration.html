<title>应用程序协作</title>
</head>
<body>

<p>估计 <b>应用程序协作</b> 表示两个或多个应用程序内部活动结构元素的聚合，这些元素协同工作以执行集体应用程序行为。</p>
<h2>類別:</h2>
<p>应用。主动结构。</p>
<h2>示例：</h2>
<p>两个应用程序组件在事务管理中协作：会计组件和计费组件。此协作执行“管理事务”任务。</p>
</body>
</html>
