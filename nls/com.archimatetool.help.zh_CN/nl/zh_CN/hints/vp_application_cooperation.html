<title>应用合作视角</title>
</head>
<body>
<p>应用程序合作视角描述了应用程序组件之间的关系，包括它们之间的信息流，或者它们提供和使用的服务。这种观点通常用于创建组织的应用程序环境概览。这种观点也用于表示（内部）服务的合作或编排，这些服务共同支持业务流程的执行。</p>
<h2>干系人：</h2>
<p>企业、流程、应用和领域架构师</p>
<h2>关注的问题</h2>
<p>应用程序之间的关系和依赖关系，服务的编排/编排，一致性和完整性，降低复杂性</p>
<h2>目的：</h2>
<p>设计</p>
<h2>范围：</h2>
<p>多层/多方面</p>
</body>
</html>
