<title>业务流程合作视角</title>
</head>
<body>
<p>业务流程合作观点用于显示一个或多个业务流程彼此之间和/或与其环境之间的关系。它既可以用于在上下文中创建业务流程的高级设计，也可以为负责一个或多个此类流程的运营经理提供对其依赖关系的洞察。业务流程合作的重要方面包括：</p>
<ul>
<li>企业主要业务流程之间的因果关系</li>
<li>将业务流程映射到业务职能</li>
<li>按业务流程实现服务</li>
<li>共享数据的使用</li>
</ul>
<p>每一个都可以看作是业务流程合作视角的“子视角”。</p>
<h2>干系人：</h2>
<p>流程和领域架构师、运营经理</p>
<h2>关注的问题</h2>
<p>业务流程、一致性和完整性、职责之间的依赖性 </p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>多层/多方面</p>
</body>
</html>
