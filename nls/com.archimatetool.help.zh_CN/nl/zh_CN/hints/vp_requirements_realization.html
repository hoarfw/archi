<title>需求实现视点</title>
</head>
<body>
<p>需求实现视角使设计人员能够通过核心要素（如业务参与者、业务服务、业务流程、应用服务、应用组件等）对需求的实现进行建模。通常，要求来自目标细化观点。</p>
<p>此外，这种观点可用于将要求细化为更详细的要求。聚合关系用于此目的。</p>
<h2>干系人：</h2>
<p>企业和ICT架构师、业务分析师、需求经理</p>
<h2>关注的问题</h2>
<p>架构策略和战术、动机</p>
<h2>目的：</h2>
<p>设计、决策、告知</p>
<h2>范围：</h2>
<p>动机</p>
</body>
</html>
