<title>间隔</title>
</head>
<body>

<p>一个 <b>间隔</b> 代表了两个平台期（或保留 Plateau 术语并注释）之间差异的陈述。</p>
<h2>類別:</h2>
<p>实施和迁移</p>
<h2>示例：</h2>
<p>“基准和目标基础设施之间的差距” ， “如何满足客户需求的知识”。</p>
</body>
