<body>
<p>免费 <b>绘图</b> 绘制您的想法的区域。</p>
<p>您可以在视图中添加新的“置顶”、“演员”形象和连接。</p>
<p>关于关系或置顶的含义没有规则。所有元素都可以在“属性”窗口中编辑。</p>
<p>您可以自由捕获模型的草图然后将其转换为完全实现的ArchiMate模型和视图。</p>
</body>
