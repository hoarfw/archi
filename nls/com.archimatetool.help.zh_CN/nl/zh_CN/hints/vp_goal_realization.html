<!DOCTYPE html>

<title>目标实现视点</title>
</head>
<body>
<p>目标实现观点允许设计师将（高级）目标的细化建模为更具体的目标，并将有形目标细化为描述实现目标所需属性的要求或约束。使用聚合关系对目标细化为子目标进行建模。使用实现关系对目标到需求的细化进行建模。</p>
<p>此外，可以对这些原则进行建模，以指导将目标细化为要求。</p>
<h2>干系人：</h2>
<p>利益相关者、业务经理、企业和ICT架构师、业务分析师、需求经理</p>
<h2>关注的问题</h2>
<p>架构使命、战略和战术、动机</p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>动机</p>
</body>
</html>
