<title>服务实现视点</title>
</head>
<body>
<p>服务实现视点用于展示一个或多个业务服务如何由底层流程（有时也包括应用组件）来实现。因此，它在业务产品视点与业务流程视图之间起到桥梁作用。它为一个或多个业务流程提供了“外部视角”。</p>
<h2>干系人：</h2>
<p>流程与领域架构师、产品经理、运营经理</p>
<h2>关注的问题</h2>
<p>业务流程的增值、流程一致性与完整性、职责划分</p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>多层/多方面</p>
</body>
</html>
