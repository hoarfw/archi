<title>干系人视点</title>
</head>
<body>
<p>干系人视点允许分析人员对干系人、内外部变更驱动因素以及这些驱动因素的评估（优势、劣势、机会与威胁）进行建模。它还可以描述这些关注点与评估如何关联到初始（高层）目标。这些目标构成需求工程过程的基础，包括目标细化、贡献与冲突分析，以及推导出实现目标的需求。</p>
<h2>干系人：</h2>
<p>利益相关者、业务经理、企业和ICT架构师、业务分析师、需求经理</p>
<h2>关注的问题</h2>
<p>架构使命与战略、动机</p>
<h2>目的：</h2>
<p>设计、决策、告知</p>
<h2>范围：</h2>
<p>动机</p>
</body>
</html>
