<title>产品视点</title>
</head>
<body>
<p>产品视角描述了这些产品为客户或其他相关外部方提供的价值，并展示了一个或多个产品在构成（业务、应用或技术）服务以及相关合同或其他协议方面的组成。它还可以用于显示提供此产品的接口（渠道）以及与产品相关的事件。产品视角通常用于产品开发，通过组合现有服务或确定必须为此产品创建哪些新服务来设计产品，因为客户期望从中获得价值。然后，它可以作为业务流程架构师和其他需要设计流程和ICT实现这些产品的人员的输入。</p>
<h2>干系人：</h2>
<p>产品开发人员、产品经理、流程和领域架构师</p>
<h2>关注的问题</h2>
<p>产品开发，企业产品提供的价值</p>
<h2>目的：</h2>
<p>设计、决定</p>
<h2>范围：</h2>
<p>多层/多方面</p>
</body>
</html>
