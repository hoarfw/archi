<title>业务职能</title>
</head>
<body>

<p>一个 <b>业务职能</b> 代表基于一组选定标准（如所需的业务资源和/或能力）的商业行为集合，并作为一个整体进行管理或执行。</p>
<h2>類別:</h2>
<p>商务。行为。</p>
<h2>示例：</h2>
<p>客户管理、会员服务、回收、付款处理、财务处理、索赔处理、资产管理、维护客户关系。</p>
</body>
