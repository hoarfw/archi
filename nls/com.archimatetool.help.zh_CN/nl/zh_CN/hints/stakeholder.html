<p>一个 <b>利益相关者</b> 代表个人、团队或组织（或其类别）的角色，代表他们在架构效应中的利益。</p>
<h2>類別:</h2>
<p>动机</p>
<h2>示例：</h2>
<p>首席执行官、董事会、股东、客户、业务和应用架构师</p>
